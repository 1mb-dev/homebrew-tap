name: test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    name: discover formulas
    runs-on: ubuntu-latest
    outputs:
      formulas: ${{ steps.list.outputs.formulas }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - id: list
        name: Enumerate Formula/*.rb
        run: |
          formulas=$(ls Formula/*.rb 2>/dev/null \
            | xargs -n1 basename \
            | sed 's/\.rb$//' \
            | jq -R . | jq -cs .)
          echo "formulas=${formulas}" >> "$GITHUB_OUTPUT"
          echo "Discovered: ${formulas}"

  brew-test:
    name: brew audit + install + test (${{ matrix.formula }})
    needs: discover
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        formula: ${{ fromJson(needs.discover.outputs.formulas) }}
    env:
      FORMULA: ${{ matrix.formula }}
    steps:
      - name: Checkout into Homebrew Taps
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: homebrew-tap

      - name: Symlink as 1mb-dev/tap
        # Use `brew --repository` (not --prefix): the Library/Taps path
        # differs between Intel (/usr/local/Homebrew/Library/Taps) and
        # Apple Silicon (/opt/homebrew/Library/Taps). --repository
        # resolves to the right base on both.
        run: |
          mkdir -p "$(brew --repository)/Library/Taps/1mb-dev"
          ln -s "$GITHUB_WORKSPACE/homebrew-tap" \
            "$(brew --repository)/Library/Taps/1mb-dev/homebrew-tap"
          brew tap | grep '^1mb-dev/tap$'

      - name: brew audit (strict, online, new)
        run: brew audit --strict --online --new "1mb-dev/tap/$FORMULA"

      - name: brew install (build from source)
        run: brew install --build-from-source "1mb-dev/tap/$FORMULA"

      - name: brew test
        run: brew test "1mb-dev/tap/$FORMULA"

      - name: brew uninstall (clean unwind)
        run: brew uninstall "$FORMULA"

  # Stable-named aggregator for branch-protection required checks.
  # Matrix leg names change as formulas are added; this one doesn't.
  passed:
    name: tests passed
    needs: brew-test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify matrix succeeded
        env:
          RESULT: ${{ needs.brew-test.result }}
        run: |
          if [ "$RESULT" != "success" ]; then
            echo "brew-test matrix result: $RESULT"
            exit 1
          fi
